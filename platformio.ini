; Optional — only needed if you use PlatformIO/VSCode instead of the
; Arduino IDE. If you use the Arduino IDE, ignore this file and just
; install the four libraries below via Library Manager instead.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib
    zinggjm/GxEPD2
    mikalhart/TinyGPSPlus
    chris--a/Keypad
